name: ares CD32X (Android)
# Builds the Android APK (arm64) and publishes it as the "android-latest" pre-release.
on:
  push:
    branches: [ main ]
    paths: [ 'android/**', 'ares/**', 'mia/**', 'nall/**', 'libco/**', 'thirdparty/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Tools
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq ninja-build
        cmake --version
        # use the runner's CMake (newer than the SDK's 3.22) for the native build
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> android/local.properties
        cat android/local.properties
        ls "$ANDROID_HOME/ndk" || true
    - name: Build APK
      working-directory: android
      run: gradle --no-daemon --stacktrace assembleRelease
    - name: Collect
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk ares-cd32x-android-arm64.apk
        ls -la ares-cd32x-android-arm64.apk
    - uses: actions/upload-artifact@v4
      with:
        name: ares-cd32x-android-arm64
        path: ares-cd32x-android-arm64.apk
    - name: Publish pre-release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        notes="ares v148 for Android (arm64, Android 8+): Genesis, Sega CD, 32X, Sega CD 32X with RAM carts (16 MB, carts 1-9). Built from ${GITHUB_SHA::7}."
        if gh release view android-latest >/dev/null 2>&1; then
          gh release edit android-latest --notes "$notes"
        else
          gh release create android-latest --prerelease --title "ares CD32X (Android, latest)" --notes "$notes" --target "$GITHUB_SHA"
        fi
        gh api -X PATCH "repos/$GH_REPO/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true || true
        gh release upload android-latest ares-cd32x-android-arm64.apk --clobber

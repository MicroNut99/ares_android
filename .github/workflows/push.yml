name: Push
# This fork builds with cd32x-windows.yml (and android.yml); upstream's full matrix is manual.
on:
  workflow_dispatch
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build ares (primary)
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      codesign: true
      official: ${{ github.ref_name == 'master' || github.ref_type == 'tag' }}
  build-aux:
    name: Build ares (auxiliary)
    uses: ./.github/workflows/build-aux.yml
    secrets: inherit
  release:
    name: Release
    needs: build
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      notarize: true
